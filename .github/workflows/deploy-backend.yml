# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - CinemaNetworkBackend

on:
  push:
    branches:
      - pc-branch
    paths:
      - "CinemaNetwork.API/**"
      - "CinemaNetwork.Application/**"
      - "CinemaNetwork.Infrastructure/**"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build with dotnet
        run: dotnet build ./CinemaNetwork.API/CinemaNetwork.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./CinemaNetwork.API/CinemaNetwork.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # ОЦЕЙ БЛОК ПЕРМІШЕНІВ ОБОВ'ЯЗКОВИЙ ДЛЯ client-id:
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp

      # Логін тепер пройде, бо ранер отримав права на ACTIONS_ID_TOKEN
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "CinemaNetworkBackend"
          package: ./myapp
